name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check pageout tests tools
          ruff format --check pageout tests tools
      - name: Types (core)
        run: mypy
      - name: Tests (no network, no browser needed)
        run: python -m pytest -q
