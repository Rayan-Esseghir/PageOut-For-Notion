name: Release

# Push a tag such as v1.0.0 (or v1.0.0-rc.2) to build and publish the Windows exe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}      # empty when no certificate is configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Tests must pass before building
        run: python -m pytest -q
      - name: Build exe
        shell: pwsh
        run: ./build_exe.ps1
      # OPTIONAL code signing: add the secrets WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD.
      # Without them the exe is published unsigned (Windows SmartScreen will warn). Untested step.
      - name: Sign exe (optional)
        if: ${{ env.CERT_B64 != '' }}
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_B64))
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                  Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          & $tool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\PageOut-for-Notion.exe
          Remove-Item cert.pfx
      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\PageOut-for-Notion.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PageOut-for-Notion.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($tag))\].*?(?=^## \[|\z)")
          if ($m.Success) { $m.Value | Out-File -Encoding utf8 release_notes.md } else { "Release $tag" | Out-File release_notes.md }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/PageOut-for-Notion.exe
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
